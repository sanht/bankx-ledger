# Credenciales de ejemplo para entorno local. En un entorno real no se versionan:
# se crean con `kubectl create secret` o se gestionan con Sealed Secrets / Vault.
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-credentials
  namespace: bankx
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: admin
  MONGO_INITDB_ROOT_PASSWORD: admin123
  SPRING_DATA_MONGODB_URI: mongodb://admin:admin123@mongodb:27017/bankx?authSource=admin
