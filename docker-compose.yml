version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: bankx-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: bankx
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - bankx-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Mock del servicio de riesgo remoto (WireMock). Respuestas en risk-mock/mappings/,
  # elegidas por el campo "simulate" del request: fail, timeout, flaky, invalid.
  risk-mock:
    image: wiremock/wiremock:3.9.1
    container_name: bankx-risk-mock
    ports:
      - "9090:8080"
    volumes:
      - ./risk-mock:/home/wiremock:ro
    networks:
      - bankx-network

volumes:
  mongodb_data:
    driver: local

networks:
  bankx-network:
    driver: bridge
