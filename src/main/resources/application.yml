spring:
  application:
    name: bankx-ledger

  # Propaga el contexto de Reactor (correlationId) a ThreadLocals como el MDC
  reactor:
    context-propagation: auto
  
  # MongoDB reactivo
  data:
    mongodb:
      uri: mongodb://admin:admin123@localhost:27017/bankx?authSource=admin
      auto-index-creation: true
  
  # JPA para módulo legado
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    root: INFO
    com.bankx: DEBUG
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 10

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    # Muestra el estado del circuit breaker en /actuator/health (apagado por defecto en Boot 3)
    circuitbreakers:
      enabled: true
  metrics:
    export:
      simple:
        enabled: true

bankx:
  sse:
    # Menor que el timeout de inactividad más corto de la cadena (ingress-nginx, APIM)
    heartbeat-interval: 15s

risk:
  service:
    url: http://localhost:9090

server:
  port: 8080
  servlet:
    context-path: /

resilience4j:
  circuitbreaker:
    instances:
      risk-service:
        register-health-indicator: true
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        # Los 4xx no indican que el servicio esté caído: no cuentan para abrir el circuito
        ignore-exception-predicate: com.bankx.service.RiskClientErrorPredicate
  
  retry:
    instances:
      risk-service:
        max-attempts: 3          # 1 intento + 2 reintentos
        wait-duration: 500ms
        # Solo errores pasajeros: conexión, 502, 503, 504 (ver la clase)
        retry-exception-predicate: com.bankx.service.TransientRiskErrorPredicate
  
  timelimiter:
    instances:
      risk-service:
        timeout-duration: 5s
        cancel-running-future: true
