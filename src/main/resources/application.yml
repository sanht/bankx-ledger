spring:
  application:
    name: bankx-ledger
  
  # MongoDB reactivo
  data:
    mongodb:
      uri: mongodb://admin:admin123@localhost:27017/bankx?authSource=admin
      auto-index-creation: true
  
  # JPA para módulo legado
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    root: INFO
    com.bankx: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 10

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    export:
      simple:
        enabled: true

risk:
  service:
    url: http://localhost:9090

server:
  port: 8080
  servlet:
    context-path: /

resilience4j:
  circuitbreaker:
    instances:
      risk-service:
        register-health-indicator: true
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000
        permitted-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  
  retry:
    instances:
      risk-service:
        max-attempts: 3
        wait-duration: 1000
        retry-exceptions:
          - java.io.IOException
          - java.net.ConnectException
  
  timelimiter:
    instances:
      risk-service:
        timeout-duration: 5s
        cancel-running-future: true
